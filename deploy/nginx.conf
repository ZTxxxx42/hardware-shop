# 五金商贸 MVP · 反向代理与静态托管
# 容器内路径:/etc/nginx/conf.d/default.conf(由 deploy/nginx.Dockerfile COPY 进镜像)
# 职责:托管 shop-web(/) 与 admin-web(/admin/) 构建产物;反代 /api 到 api:8000;
#       gzip;静态资源长缓存;TLS 终止(可选,见文件末尾注释模板)。

gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 买家端 shop-web 构建产物为默认站点
    root /usr/share/nginx/html/shop-web;
    index index.html;

    # 入口 HTML 不缓存,保证发布后立即生效
    location = /index.html {
        root /usr/share/nginx/html/shop-web;
        add_header Cache-Control "no-cache";
    }

    # 买家端 SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 买家端构建产物缓存(/assets/ 文件名带 hash)
    location ^~ /assets/ {
        root /usr/share/nginx/html/shop-web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理端入口补全斜杠
    location = /admin {
        return 301 /admin/;
    }

    # 管理端入口 HTML 不缓存
    location = /admin/index.html {
        alias /usr/share/nginx/html/admin-web/index.html;
        add_header Cache-Control "no-cache";
    }

    # 管理端构建产物缓存
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin-web/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理端 SPA(子路径 /admin/ 挂载)
    # 前提:admin-web 以 base=/admin/ 构建(vite.config.ts 与 router 均已配置,构建时自动生效)
    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin-web/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反向代理(保留 /api 前缀,与 FastAPI api_prefix 一致)
    location ^~ /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

