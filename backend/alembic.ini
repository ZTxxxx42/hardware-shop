# Alembic migration config (PostgreSQL 16 + SQLAlchemy 2.0 + psycopg3)
# Connection string prefers env var DATABASE_URL, else falls back to the default below.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# postgresql+psycopg:// uses psycopg3 (psycopg[binary])
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/hardware_shop

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
