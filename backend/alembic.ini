# Alembic 迁移配置（PostgreSQL 16 + SQLAlchemy 2.0 + psycopg3）
# 实际连接串优先取环境变量 DATABASE_URL，否则使用下方默认值。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# postgresql+psycopg:// 使用 psycopg3（psycopg[binary]）
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/hardware_trade

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
